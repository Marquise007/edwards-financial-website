<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Board Retirements · Prospecting · Edwards Financial &amp; Associates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="/resources/gate.js"></script>
<style>
:root{--navy:#0d1e3a;--gold:#b8972e;--gold-tint:#e8dcc2;--cream:#f7f5f1;--ink:#22262e;--ink-soft:#4c545f;--rule:#d8cfbb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--cream);font-variant-numeric:lining-nums tabular-nums}
nav.back{padding:14px 6vw;background:#fff;border-bottom:1px solid var(--rule);font-size:13px}
nav.back a{color:var(--navy);text-decoration:none;font-weight:500;margin-right:18px}
header.hero{background:var(--navy);color:#fff;padding:38px 6vw 30px;border-bottom:4px solid var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-tint)}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(30px,3.6vw,42px);margin-top:8px}
h1 em{font-style:normal;color:var(--gold)}
main{padding:26px 6vw 72px;max-width:1360px;margin:0 auto}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:end}
.filters label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;display:block;margin-bottom:5px}
.filters select,.filters input{font-family:'DM Sans',sans-serif;font-size:13.5px;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 1px 3px rgba(13,30,58,.06)}
thead th{background:var(--navy);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:11px 13px}
tbody td{font-size:13.5px;padding:9px 13px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--cream)}
td.nm{font-weight:700;color:var(--navy);white-space:nowrap}
td.money,td.num{white-space:nowrap;text-align:right}
.links a{display:inline-block;margin-right:9px;font-size:12px;font-weight:500;color:var(--navy);text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--gold-tint);background:var(--cream);color:var(--gold);border-radius:2px}
.pill.new{border-color:var(--gold);color:var(--navy);background:#fdf7e8}
.empty{background:#fff;border:1px dashed var(--rule);padding:34px;text-align:center;font-size:14.5px;color:var(--ink-soft);line-height:1.6}
.empty b{color:var(--navy)}
@media(max-width:820px){thead{display:none}tbody td{display:block}tbody tr{display:block;border-bottom:2px solid var(--rule);padding:8px 0}td.money,td.num{text-align:left}}
</style>
</head>
<body>
<nav class="back"><a href="./">&larr; Prospecting</a><a href="search">Prospect Search</a><a href="warn">WARN Tracker</a></nav>
<header class="hero">
  <div class="eyebrow">Prospecting · Layer 1</div>
  <h1>Board <em>Retirements</em></h1>
</header>
<main>
  <div class="filters">
    <div><label>State</label><select id="f-state"><option value="">All</option><option>CA</option><option>WA</option></select></div>
    <div><label>Status</label><select id="f-status"><option value="">Active (new + reviewed)</option><option value="new">New only</option><option value="pushed_to_crm">Pushed to CRM</option><option value="skip">Skipped</option></select></div>
    <div><label>Employer contains</label><input id="f-emp" placeholder="district or agency"></div>
    <div><button id="go" style="font-family:'DM Sans';font-weight:700;font-size:13.5px;background:var(--navy);color:#fff;border:none;padding:10px 18px;cursor:pointer;border-radius:2px">Apply</button></div>
  </div>
  <div id="wrap"><div class="empty">Loading&hellip;</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rybnzvlogmbjlgdziswj.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5Ym56dmxvZ21iamxnZHppc3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjE3MjgsImV4cCI6MjA5NjAzNzcyOH0.m7oH-z4yI1AbchocncJU2TB7SawyijiXsTbcz3slwn0";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtM=v=>v==null?"":"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:0});
const fmtD=v=>v==null?"":new Date(v+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
async function run(){
  let q=db.from("board_retirements").select("*").order("created_at",{ascending:false}).limit(300);
  const st=$("f-state").value; if(st)q=q.eq("state",st);
  const s=$("f-status").value; if(s)q=q.eq("status",s); else q=q.in("status",["new","reviewed"]);
  const emp=$("f-emp").value.trim(); if(emp)q=q.ilike("employer","%"+emp+"%");
  const {data,error}=await q;
  const el=$("wrap");
  if(error){el.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return;}
  if(!data||!data.length){el.innerHTML='<div class="empty"><b>No announced retirements on file yet.</b><br>This table fills each weekday morning from the board sweep across 1,375 district and agency sources. Until then, the Prospect Search area already holds every named record.</div>';return;}
  el.innerHTML=`<table><thead><tr><th>Name</th><th>Employer</th><th>State</th><th>County</th><th>Effective</th><th>System</th>
    <th style="text-align:right">Yrs (reported)</th><th style="text-align:right">TC Salary</th><th style="text-align:right">TC Pension</th><th>Source</th><th>Find</th><th>Status</th></tr></thead><tbody>`+
    data.map(r=>`<tr><td class="nm">${esc(r.person_name)}</td><td>${esc(r.employer)}</td><td>${esc(r.state)}</td><td>${esc(r.county??"")}</td>
      <td>${fmtD(r.effective_date)}</td><td>${esc(r.pension_system??"")}</td>
      <td class="num">${r.reported_years_service??""}</td>
      <td class="money">${fmtM(r.tc_salary)}</td><td class="money">${fmtM(r.tc_pension)}</td>
      <td>${r.doc_url?`<a href="${esc(r.doc_url)}" target="_blank" rel="noopener">doc</a>`:""}</td>
      <td class="links">${r.li_search_url?`<a href="${esc(r.li_search_url)}" target="_blank" rel="noopener">LinkedIn</a>`:""}
        ${r.fb_search_url?`<a href="${esc(r.fb_search_url)}" target="_blank" rel="noopener">FB</a>`:""}
        ${r.ig_search_url?`<a href="${esc(r.ig_search_url)}" target="_blank" rel="noopener">IG</a>`:""}</td>
      <td><span class="pill ${r.status==="new"?"new":""}">${esc(r.status)}</span></td></tr>`).join("")+"</tbody></table>";
}
$("go").addEventListener("click",run);
run();
</script>
</body>
</html>
